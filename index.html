<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- STYLES -->
    <link rel="stylesheet" href="./src/style.css" />
    <title>portfolio</title>
  </head>
  <body>
    <main class="container">
      <header>
        <nav>
          <a class="logo" href="#">
            romario <span class="logo-green">korzun</span>
          </a>
          <div class="nav-side">
            <nav class="nav-list">
              <ul>
                <li class="nav-link">About me</li>
                <li class="nav-link">Projects</li>
                <li class="nav-link">Contacts</li>
              </ul>
            </nav>

            <label class="switch">
              <input type="checkbox" class="switch-input" />
              <span class="switch-slider"></span>
            </label>
            <button class="btn-order" type="button">order the project</button>
          </div>
          <button
            class="burger"
            type="button"
            aria-label="Открыть меню"
            aria-expanded="false"
          >
            <span class="burger-line"></span>
            <span class="burger-line"></span>
            <span class="burger-line"></span>
          </button>
        </nav>
      </header>
      <!-- BACKDROP MODAL -->
      <div class="backdrop">
        <div class="modal">
          <div class="modal-header">
            <a class="logo" href="#">
              romario <span class="logo-green">korzun</span>
            </a>
            <button
              class="burger"
              type="button"
              aria-label="Открыть меню"
              aria-expanded="false"
            >
              <span class="burger-line"></span>
              <span class="burger-line"></span>
              <span class="burger-line"></span>
            </button>
          </div>
          <nav class="modal-nav">
            <ul class="modal-nav-list">
              <li><a href="#about" class="modal-nav-link">About me</a></li>
              <li><a href="#projects" class="modal-nav-link">Projects</a></li>
              <li><a href="#contacts" class="modal-nav-link">Contacts</a></li>
            </ul>
          </nav>
          <label class="switch-modal">
            <input type="checkbox" class="switch-modal-input" />
            <span class="switch-modal-slider"></span>
          </label>
          <button class="btn-modal-order" type="button">
            order the project
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
